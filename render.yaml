services:
  - type: web
    name: qbk-youth-kpi-snapshot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: YOUTH_KPI_SNAPSHOT_MODE
        value: "true"
      - key: YOUTH_KPI_SNAPSHOT_TARGET
        value: render
      - key: YOUTH_KPI_SNAPSHOT_DIR
        value: /opt/render/project/src/app/snapshot
      - key: YOUTH_INBOX_ID
        value: "207883"
      - key: APP_PASSWORD
        sync: false
